server:
  # Cloud Run injects PORT; locally default to 8761
  port: ${PORT:8761}

spring:
  application:
    name: service-discovery

eureka:
  instance:
    # In Cloud Run, set EUREKA_INSTANCE_HOSTNAME to your run URL
    # e.g. educonservicediscovery-64307221061.asia-south1.run.app
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

    # HTTP/HTTPS exposure
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED:false}
    secure-port-enabled: ${EUREKA_SECURE_PORT_ENABLED:true}
    secure-port: 443

    # UI & health links
    home-page-url: https://${eureka.instance.hostname}/
    status-page-url: https://${eureka.instance.hostname}/actuator/info
    health-check-url: https://${eureka.instance.hostname}/actuator/health

  client:
    # Eureka server should NOT register to itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      # Used only by clients; we set it here so they can reuse this value via env
      defaultZone: https://${eureka.instance.hostname}/eureka/

  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    renewal-percent-threshold: 0.49
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
