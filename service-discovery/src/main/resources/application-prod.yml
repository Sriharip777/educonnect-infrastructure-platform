server:
  # Cloud Run injects PORT; local default 8761
  port: ${PORT:8761}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:service-discovery}

eureka:
  client:
    # Eureka server should NOT register itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      # IMPORTANT:
      # - Local: http://localhost:${PORT}/eureka/
      # - Cloud Run: https://<service>.run.app/eureka/
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${PORT:8761}/eureka/}

  instance:
    # For Cloud Run set: EUREKA_INSTANCE_HOSTNAME=educonservicediscovery-....run.app
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}

    # Cloud Run should publish HTTPS endpoints (even though container is HTTP)
    secure-port-enabled: ${EUREKA_SECURE_PORT_ENABLED:true}
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED:false}
    secure-port: 443

    # DO NOT add :${server.port} for Cloud Run; public URL is always 443.
    home-page-url: ${EUREKA_HOME_PAGE_URL:https://${eureka.instance.hostname}/}
    status-page-url: ${EUREKA_STATUS_PAGE_URL:https://${eureka.instance.hostname}/actuator/info}
    health-check-url: ${EUREKA_HEALTH_CHECK_URL:https://${eureka.instance.hostname}/actuator/health}

  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL:5000}
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.netflix.eureka: ${LOG_LEVEL_EUREKA:INFO}
    com.netflix.discovery: ${LOG_LEVEL_DISCOVERY:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
