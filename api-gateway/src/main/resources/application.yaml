server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          discovery:
            locator:
              enabled: false

          routes:

            # =========================
            # AUTH SERVICE
            # =========================
            - id: auth-service
              uri: lb://auth-user-service
              order: -20
              predicates:
                - Path=/api/auth/**
              filters:
                - Retry=2
                - name: CircuitBreaker
                  args:
                    name: auth-cb
                    fallbackUri: forward:/fallback/auth

            # =========================
            # USER ROLE SERVICE
            # =========================
            - id: user-role-service
              uri: lb://auth-user-service
              order: -15
              predicates:
                - Path=/api/student/**,/api/teacher/**,/api/parent/**,/api/admin/**
              filters:
                - Retry=2
                - name: CircuitBreaker
                  args:
                    name: user-role-cb
                    fallbackUri: forward:/fallback/auth

            # =========================
            # LMS SERVICES
            # =========================

            - id: assignments-service
              uri: lb://learning-management-service
              order: -10
              predicates:
                - Path=/api/assignments/**
              filters:
                - Retry=2
                - name: CircuitBreaker
                  args:
                    name: assignments-cb
                    fallbackUri: forward:/fallback/lms

            - id: questions-service
              uri: lb://learning-management-service
              order: -10
              predicates:
                - Path=/api/questions/**
              filters:
                - Retry=2
                - name: CircuitBreaker
                  args:
                    name: questions-cb
                    fallbackUri: forward:/fallback/lms

            - id: submissions-service
              uri: lb://learning-management-service
              order: -10
              predicates:
                - Path=/api/submissions/**
              filters:
                - Retry=2
                - name: CircuitBreaker
                  args:
                    name: submissions-cb
                    fallbackUri: forward:/fallback/lms

            # =========================
            # CONTENT SERVICES
            # =========================

            - id: material-service
              uri: lb://content-service
              order: 10
              predicates:
                - Path=/api/material/**
              filters:
                - Retry=2
                - name: CircuitBreaker
                  args:
                    name: material-cb
                    fallbackUri: forward:/fallback/content

            - id: recordings-service
              uri: lb://content-service
              order: 10
              predicates:
                - Path=/api/recordings/**
              filters:
                - Retry=2
                - name: CircuitBreaker
                  args:
                    name: recordings-cb
                    fallbackUri: forward:/fallback/content

            - id: courses-service
              uri: lb://content-service
              order: 10
              predicates:
                - Path=/api/courses/**
              filters:
                - Retry=2
                - name: CircuitBreaker
                  args:
                    name: courses-cb
                    fallbackUri: forward:/fallback/content

  # ✅ Redis must be under spring
  redis:
    host: localhost
    port: 6379
    timeout: 60000


# =========================
# EUREKA
# =========================

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true


# =========================
# ACTUATOR
# =========================

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes


# =========================
# LOGGING
# =========================

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO


# =========================
# JWT CONFIG
# =========================

jwt:
  secret: my-super-secret-jwt-key-for-educonnect-platform-minimum-256-bits-required
  expiration: 86400000
  refresh-expiration: 604800000


# =========================
# RESILIENCE4J
# =========================

resilience4j:
  circuitbreaker:
    instances:
      auth-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      user-role-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

      assignments-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50

      questions-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50

      submissions-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50

      material-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50

      recordings-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50

      courses-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50


# =========================
# RATE LIMITER DEFAULTS
# =========================

gateway:
  rate-limiter:
    default:
      replenishRate: 10
      burstCapacity: 20