server:
  port: ${PORT:8080}
  netty:
    connection-timeout: 30s

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}

  cloud:
    gateway:
      websocket:
        enabled: true

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # AUTH SERVICE (matches GatewayConfig)
        - id: auth-password-reset
          uri: lb://auth-user-service
          predicates:
            - Path=/api/auth/password/reset-request,/api/auth/password/reset
          filters:
            - name: Retry
              args:
                retries: 2

        - id: auth-service
          uri: lb://auth-user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rateLimiter: authRateLimiter
                keyResolver: "#{@userKeyResolver}"
                denyEmptyKey: false
            - name: CircuitBreaker
              args:
                name: auth-service-cb
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 2
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: student-service
          uri: lb://auth-user-service
          predicates:
            - Path=/api/student/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service-cb
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 2

        - id: teacher-service
          uri: lb://auth-user-service
          predicates:
            - Path=/api/teacher/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service-cb
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 2

        - id: parent-service
          uri: lb://auth-user-service
          predicates:
            - Path=/api/parent/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service-cb
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 2

        - id: admin-service
          uri: lb://auth-user-service
          predicates:
            - Path=/api/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service-cb
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 2

        - id: user-service
          uri: lb://auth-user-service
          predicates:
            - Path=/user-service/api/users/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: auth-service-cb
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 2

        # Other services (learning, communication, financial, notification, integration, content)
        # map exactly as in your GatewayConfig (same lb:// names)

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: Retry
          args:
            retries: 2
            methods: GET,POST,PUT,DELETE
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms

      httpclient:
        connect-timeout: 60000
        response-timeout: 5m
        websocket:
          max-frame-payload-length: 1048576
          proxy-ping: true

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

    loadbalancer:
      enabled: true
      ribbon:
        enabled: false
      cache:
        enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      connect-timeout: 5000ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    register-with-eureka: true
    fetch-registry: true
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10

  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${random.value}
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED:false}
    secure-port-enabled: ${EUREKA_SECURE_PORT_ENABLED:true}
    secure-port: ${EUREKA_SECURE_PORT:443}
    home-page-url: https://${eureka.instance.hostname}/
    status-page-url: https://${eureka.instance.hostname}/actuator/info
    health-check-url: https://${eureka.instance.hostname}/actuator/health
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.tcon.api_gateway: ${LOG_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: INFO
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
