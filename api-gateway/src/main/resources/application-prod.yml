server:
  port: ${PORT:8080}
  netty:
    connection-timeout: 30s

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}

  # ===========================
  # KAFKA (SELF-HOSTED / VPC)
  # ===========================
  kafka:
    # Local default: localhost:9092
    # Cloud/VPC: set KAFKA_BOOTSTRAP_SERVERS=10.0.0.5:9092
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:${spring.application.name}-group}
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # Important for Cloud Run / cloud environments
      session-timeout-ms: 60000
      heartbeat-interval-ms: 20000
      max-poll-interval-ms: 300000

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

    properties:
      # No SASL for internal VPC traffic (self-hosted Kafka)
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      request.timeout.ms: 30000
      connections.max.idle.ms: 540000
      # Uncomment and configure if you later use Confluent Cloud / SASL
      # sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      # sasl.jaas.config: >
      #   org.apache.kafka.common.security.plain.PlainLoginModule required
      #   username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";

  # ===========================
  # REDIS (RATE LIMITING / CACHE)
  # ===========================
  data:
    redis:
      # Local default: localhost
      # Cloud/VPC: set REDIS_HOST=10.0.0.10
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000ms}
      ssl:
        # Internal VPC: false; RedisLabs/Cloud: true
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:10}
          max-idle: ${REDIS_POOL_MAX_IDLE:5}
          min-idle: 2
          max-wait: 1000ms

  # ===========================
  # SPRING CLOUD GATEWAY
  # ===========================
  cloud:
    gateway:
      websocket:
        enabled: true

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # YAML routes (example: auth + websocket)
      routes:
        - id: auth-service
          uri: lb://AUTH-USER-SERVICE
          predicates:
            - Path=/api/auth/**
            - Method=GET,POST,PUT,DELETE,OPTIONS,PATCH
          filters:
            # Remove first path segment if your services expect `/auth/**` instead of `/api/auth/**`
            # Comment out if not needed
            # - StripPrefix=1
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

        - id: video-websocket
          uri: lb://VIDEO-SERVICE
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=0

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: Retry
          args:
            retries: 2
            methods: GET,POST,PUT,DELETE
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms

      httpclient:
        connect-timeout: 60000
        response-timeout: 5m
        websocket:
          max-frame-payload-length: 1048576
          proxy-ping: true

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# ===========================
# EUREKA (DISCOVERY)
# ===========================
eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      # Local: http://localhost:8761/eureka/
      # Cloud: set EUREKA_URL=https://educonservicediscovery-64307221061.asia-south1.run.app/eureka/
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10

  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${random.value}
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED:false}
    secure-port-enabled: ${EUREKA_SECURE_PORT_ENABLED:true}
    secure-port: ${EUREKA_SECURE_PORT:443}
    home-page-url: https://${eureka.instance.hostname}/
    status-page-url: https://${eureka.instance.hostname}/actuator/info
    health-check-url: https://${eureka.instance.hostname}/actuator/health
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# ===========================
# JWT CONFIG
# ===========================
jwt:
  secret: ${JWT_SECRET:my-super-secret-jwt-key-for-educonnect-platform-minimum-256-bits-required}
  expiration: ${JWT_EXPIRATION:86400000}

# ===========================
# ACTUATOR / MANAGEMENT
# ===========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# ===========================
# LOGGING
# ===========================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.tcon.api_gateway: ${LOG_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: INFO
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
