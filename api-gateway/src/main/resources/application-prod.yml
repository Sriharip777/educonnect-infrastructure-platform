server:
  port: ${PORT:8080}
  netty:
    connection-timeout: 30s

spring:
  application:
    name: API-GATEWAY

  # ================================
  # KAFKA
  # ================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:api-gateway-group}
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      session-timeout-ms: 60000
      heartbeat-interval-ms: 20000
      max-poll-interval-ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      request.timeout.ms: 30000
      connections.max.idle.ms: 540000

  # ================================
  # REDIS
  # ================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5000ms}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:10}
          max-idle: ${REDIS_POOL_MAX_IDLE:5}
          min-idle: 2
          max-wait: 1000ms

  # ================================
  # CLOUD GATEWAY
  # ================================
  cloud:
    gateway:
      websocket:
        enabled: true

      discovery:
        locator:
          enabled: true
          lower-case-service-id: false

      httpclient:
        connect-timeout: 60000
        response-timeout: 5m
        websocket:
          max-frame-payload-length: 1048576
          proxy-ping: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - https://educonnect.tconsolutions.com
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:4200
            allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD]
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Type
              - X-User-Id
              - X-User-Role
              - X-User-Email
            allowCredentials: true
            maxAge: 3600

      routes:

        # =========================
        # AUTH SERVICE
        # =========================
        - id: auth-service
          uri: lb://AUTH-USER-SERVICE
          order: -20
          predicates:
            - Path=/api/auth/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth

        # =========================
        # USER ROLE SERVICE
        # =========================
        - id: user-role-service
          uri: lb://AUTH-USER-SERVICE
          order: -15
          predicates:
            - Path=/api/student/**,/api/teacher/**,/api/parent/**,/api/admin/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: user-role-cb
                fallbackUri: forward:/fallback/auth

        # =========================
        # LMS - ASSIGNMENTS
        # =========================
        - id: assignments-service
          uri: lb://LEARNING-MANAGEMENT-SERVICE
          order: -10
          predicates:
            - Path=/api/assignments/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: assignments-cb
                fallbackUri: forward:/fallback/lms

        # =========================
        # LMS - QUESTIONS
        # =========================
        - id: questions-service
          uri: lb://LEARNING-MANAGEMENT-SERVICE
          order: -10
          predicates:
            - Path=/api/questions/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: questions-cb
                fallbackUri: forward:/fallback/lms

        # =========================
        # LMS - SUBMISSIONS
        # =========================
        - id: submissions-service
          uri: lb://LEARNING-MANAGEMENT-SERVICE
          order: -10
          predicates:
            - Path=/api/submissions/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: submissions-cb
                fallbackUri: forward:/fallback/lms

        # =========================
        # LMS - COURSES
        # =========================
        - id: courses-service
          uri: lb://LEARNING-MANAGEMENT-SERVICE
          order: -10
          predicates:
            - Path=/api/courses/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: courses-cb
                fallbackUri: forward:/fallback/lms

        # =========================
        # CONTENT - MATERIAL
        # =========================
        - id: material-service
          uri: lb://CONTENT-SERVICE
          order: 10
          predicates:
            - Path=/api/material/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: material-cb
                fallbackUri: forward:/fallback/content

        # =========================
        # CONTENT - RECORDINGS
        # =========================
        - id: recordings-service
          uri: lb://CONTENT-SERVICE
          order: 10
          predicates:
            - Path=/api/recordings/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: recordings-cb
                fallbackUri: forward:/fallback/content

        # =========================
        # FINANCIAL SERVICE
        # =========================
        - id: financial-service
          uri: lb://FINANCIAL-SERVICE
          order: 5
          predicates:
            - Path=/api/financial/**,/api/payments/**,/api/fees/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: financial-cb
                fallbackUri: forward:/fallback/financial

        # =========================
        # COMMUNICATION SERVICE
        # =========================
        - id: communication-service
          uri: lb://COMMUNICATION-SERVICE
          order: 5
          predicates:
            - Path=/api/messages/**,/api/notifications/**,/ws-messaging/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - Retry=2
            - name: CircuitBreaker
              args:
                name: communication-cb
                fallbackUri: forward:/fallback/communication

# ================================
# EUREKA
# ================================
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:https://educonservicediscovery-64307221061.asia-south1.run.app/eureka/}
    registry-fetch-interval-seconds: 15
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    instance-id: ${eureka.instance.hostname}:${server.port}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443
    home-page-url: https://${eureka.instance.hostname}/
    status-page-url: https://${eureka.instance.hostname}/actuator/info
    health-check-url: https://${eureka.instance.hostname}/actuator/health
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 90

# ================================
# JWT
# ================================
jwt:
  secret: ${JWT_SECRET:my-super-secret-jwt-key-for-educonnect-platform-minimum-256-bits-required}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# ================================
# ACTUATOR
# ================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# ================================
# LOGGING
# ================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.tcon.api_gateway: ${LOG_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: INFO
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ================================
# RESILIENCE4J
# ================================
resilience4j:
  circuitbreaker:
    instances:
      auth-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      user-role-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      assignments-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      questions-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      submissions-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      courses-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      material-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      recordings-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      financial-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      communication-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

# ================================
# RATE LIMITER
# ================================
gateway:
  rate-limiter:
    default:
      replenishRate: 10
      burstCapacity: 20
