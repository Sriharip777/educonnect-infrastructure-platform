# ============================================================================
# API GATEWAY - PRODUCTION CONFIG (CLOUD RUN)
# ============================================================================
server:
  port: 8080
  netty:
    connection-timeout: 30s

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    # Disable Spring Cloud Bootstrap / Config Server
    bootstrap:
      enabled: false
    config:
      enabled: false

    gateway:
      # WebSocket support
      websocket:
        enabled: true

      # Routes are defined in Java (GatewayConfig),
      # so DO NOT define spring.cloud.gateway.routes here.

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: Retry
          args:
            retries: 2
            methods: GET,POST,PUT,DELETE
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms

      httpclient:
        connect-timeout: 60000
        response-timeout: 5m
        websocket:
          max-frame-payload-length: 1048576
          proxy-ping: true

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

  loadbalancer:
    enabled: true
    ribbon:
      enabled: false
    cache:
      enabled: false

  data:
    redis:
      # PRODUCTION REDIS CONFIG
      host: redis-15043.c1.us-central1-2.gce.cloud.redislabs.com
      port: 15043
      password: Redies@123
      timeout: 5000ms
      connect-timeout: 5000ms
      ssl:
        enabled: true
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms

# ============================================================================
# EUREKA - SERVICE DISCOVERY
# ============================================================================

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      # Discovery service on Cloud Run
      defaultZone: https://educonservicediscovery-64307221061.asia-south1.run.app/eureka/
    registry-fetch-interval-seconds: 30
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10

  instance:
    prefer-ip-address: false
    hostname: educonapigateway-64307221061.asia-south1.run.app
    instance-id: ${spring.application.name}:${random.value}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443
    home-page-url: https://${eureka.instance.hostname}/
    status-page-url: https://${eureka.instance.hostname}/actuator/info
    health-check-url: https://${eureka.instance.hostname}/actuator/health
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# ============================================================================
# JWT
# ============================================================================

jwt:
  secret: my-super-secret-jwt-key-for-educonnect-platform-minimum-256-bits-required
  expiration: 86400000

# ============================================================================
# ACTUATOR / MONITORING
# ============================================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# ============================================================================
# LOGGING
# ============================================================================

logging:
  level:
    root: INFO
    com.tcon.api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: INFO
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
